name: Parkur Online APK
on:
  push:
    branches: [online]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK lisansları
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: APK'yı derle
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ParkurOnline.apk
      - name: Sürüm sayfasına koy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "online-v${{ github.run_number }}" ParkurOnline.apk --target online --title "Parkur Online v${{ github.run_number }}" --notes "Telefona indirip kurun."
      - name: APK'yı online-apk dalına kaydet
        run: |
          mkdir /tmp/apkb && cp ParkurOnline.apk /tmp/apkb/ && cd /tmp/apkb
          git init -q -b online-apk
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add ParkurOnline.apk && git commit -qm "APK ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" online-apk
